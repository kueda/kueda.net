- title: Chuck
  url: https://github.com/kueda/chuck
  summary: |
    Chuck is a desktop app for viewing DarwinCore Archives, the data format
    used by GBIF, Symbiota, and other biodiversity platforms. It will
    also _create_ DarwinCore Archives from your iNat data, so it doubles as
    an iNat backup tool.

- title: Cuanto.bio
  url: https://cuanto.bio
  summary: |
    🚧 Under construction! Cuanto is a tool for counting organisms. If you have
    species you want people to count, you can set up a protocol, send your
    volunteers the URL, and they can start counting. It's a bit like eBird
    for anything.

- title: iNaturalist
  url: https://www.inaturalist.org
  summary: |
    In addition to being a co-founder, I played roles in almost all aspects of
    developing iNaturalist from 2008 to 2025. Most of my code contributions
    are in the [core web application](https://github.com/inaturalist/inaturalist).

- title: Underfoot
  url: https://underfoot.rocks
  summary: |
    Originally intended to be an Android app for showing digitized geology and
    hydrological information, now it's a <abbr title="Progressive Web
    Application">PWA</abbr>. It's not really ready for public consumption and
    probably never will be, but I use it.
